[General]
# mode: auto (day theme 06:00-17:59, night otherwise), light, or dark.
# forceHour (0-23) only affects auto mode. -1 follows the clock: night theme from 18:00 to 05:59. Set 0-23 to force an hour.
mode=auto
forceHour=-1
# Optional clock font file inside this folder, for example: clockFontFile=fonts/Lexend-Bold.ttf
clockFontFile=
# Preview only. test.sh turns this on in a temporary copy so the wrong-password animation can be seen.
demo=false
